<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이름을 알려주세요. 당신을 위한 따뜻한 환영 인사를 준비했어요.">
  <title>어서오세요 · 작은 환영</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#263b32;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100svh;display:flex;flex-direction:column}header{padding:30px 6%;font-size:15px;font-weight:700;letter-spacing:-.4px;display:flex;gap:10px;align-items:center}.mark{width:24px;height:24px;background:#386650;border-radius:50% 50% 6px 50%;display:inline-block;transform:rotate(-18deg)}main{flex:1;display:grid;place-items:center;padding:40px 24px 80px}.card{width:100%;max-width:520px;text-align:center}.illustration{width:112px;height:112px;margin:0 auto 32px;border-radius:50%;background:#e6ecdf;display:grid;place-items:center;font-size:48px;box-shadow:0 0 0 12px #eef0e8}.eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:#75816d;margin:0 0 18px}h1{font-size:clamp(32px,6vw,44px);line-height:1.4;letter-spacing:-2px;margin:0 0 16px;overflow-wrap:anywhere}.description{color:#7b817a;font-size:15px;line-height:1.8;margin:0 0 36px}.form-box{background:#fff;border:1px solid #e5e7df;border-radius:20px;padding:26px;text-align:left;box-shadow:0 12px 36px #273c3206}label{font-size:13px;font-weight:700;display:block;margin-bottom:10px}input{font:inherit;width:100%;padding:16px;border:1px solid #dce1d8;border-radius:10px;background:#fafbf8;color:#263b32;outline:none}input:focus{border-color:#386650;box-shadow:0 0 0 3px #38665018}input::placeholder{color:#a1a69c}button{cursor:pointer;width:100%;border:0;border-radius:10px;background:#386650;color:#fff;padding:17px;margin-top:14px;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;transition:background .2s}button:hover{background:#294f3d}button:focus-visible{outline:3px solid #9fb795;outline-offset:3px}.note{font-size:12px;text-align:center;color:#93998d;margin:18px 0 0}footer{padding:24px;text-align:center;color:#999e92;font-size:12px;letter-spacing:.3px}.success{animation:appear .4s ease}@keyframes appear{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){header{padding:24px}main{padding-top:24px}.form-box{padding:22px}}
  </style>
</head>
<body>
  <header><span class="mark" aria-hidden="true"></span>작은 환영</header>
  <main>
    <section class="card" aria-label="환영 인사">
      <div class="illustration" aria-hidden="true">👋</div>
      <p class="eyebrow">A LITTLE WELCOME</p>
      <div id="greeting" aria-live="polite" aria-atomic="true">
        <h1>만나서 반가워요.</h1>
        <p class="description">당신의 이름을 알려주세요.<br>따뜻한 인사로 오늘을 시작해요.</p>
      </div>
      <form class="form-box" id="welcome-form">
        <label for="name">이름</label>
        <input id="name" name="name" placeholder="이름을 입력해주세요" autocomplete="given-name" maxlength="40" required>
        <button type="submit">환영 인사 받기 <span aria-hidden="true">→</span></button>
        <p class="note">입력한 이름은 저장되지 않아요.</p>
      </form>
    </section>
  </main>
  <footer>당신의 하루에 작은 반가움을.</footer>
  <script>
    const form = document.querySelector('#welcome-form');
    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');
    nameInput.addEventListener('input', () => nameInput.setCustomValidity(''));
    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.setCustomValidity('이름을 입력해주세요.');
        nameInput.reportValidity();
        return;
      }
      nameInput.setCustomValidity('');
      const title = document.createElement('h1');
      title.textContent = `${name}님 어서오세요`;
      const message = document.createElement('p');
      message.className = 'description';
      message.textContent = '오늘도 기분 좋은 하루 보내세요.';
      greeting.replaceChildren(title, message);
      greeting.classList.remove('success');
      void greeting.offsetWidth;
      greeting.classList.add('success');
    });
  </script>
</body>
</html>
